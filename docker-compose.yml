services:
  web:
    build:
      context: .
      target: dev
    container_name: video-edit-dev
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm","run","dev","--","--host","0.0.0.0","--port","5173"]

  web-prod:
    build:
      context: .
      target: prod
    container_name: video-edit-prod
    ports:
      - "4173:4173"
    environment:
      - NODE_ENV=production
